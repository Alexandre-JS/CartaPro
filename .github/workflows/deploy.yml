# Publica a API quando main muda — via branch `deploy` + Git deploy do Hostinger.
#
# O Hostinger sabe fazer `git pull`, mas não corre composer nem build nenhum.
# Então o build corre aqui, nas máquinas do GitHub, e o resultado é empurrado
# para o branch `deploy`: uma árvore pronta a servir, com vendor/ incluído.
# O próprio workflow chama o webhook privado do Hostinger a seguir. Isto é
# intencional: pushes feitos com GITHUB_TOKEN não voltam a disparar automações
# dependentes de eventos do GitHub de forma fiável.
#
# O GITHUB_TOKEN autoriza o push e, por ser temporário, também autentica a
# finalização. Só HOSTINGER_DEPLOY_WEBHOOK precisa de ser configurado como
# secret do repositório. FTP e SSH não são usados.
#
# O deploy depende dos testes. As rotas de cobrança ficam desligadas por
# PAYMENTS_ENABLED=false até a integração estar pronta para produção.

name: Deploy API

on:
  push:
    branches: [main]
    # Alterações da app móvel não publicam nem consomem minutos de CI da API.
    paths:
      - 'carta-api/**'
      - '.github/workflows/deploy.yml'
  # Permite publicar à mão a partir do separador Actions, sem um commit novo.
  workflow_dispatch:

concurrency:
  # Dois builds em simultâneo terminariam em dois force-push desordenados.
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testes:
    # No acionamento manual o GitHub permite escolher uma branch. Apenas main
    # pode ser transformada no artefacto de produção.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carta-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # A mesma do servidor. O site correu em 8.3 até o composer.lock
          # passar a exigir >=8.4.1 — o vendor construído em 8.4 recusava
          # arrancar lá e todo o site respondia 500 sem dizer porquê. A versão
          # daqui, a do servidor e a do lock têm de andar juntas.
          php-version: '8.4'
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      # Sem preparar ambiente: o .env.testing está no repositório e o Laravel
      # prefere-o quando APP_ENV=testing, que é o que o phpunit.xml define.
      - name: Testes
        run: php artisan test

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.DEPLOY_APP_URL || 'https://ivory-shark-126778.hostingersite.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuração de publicação
        env:
          HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          test -n "$HOSTINGER_DEPLOY_WEBHOOK" || {
            echo 'Secret HOSTINGER_DEPLOY_WEBHOOK não configurado.' >&2
            exit 1
          }

      - uses: shivammathur/setup-php@v2
        with:
          # Tem de acompanhar a do job de testes e a do servidor. Ficou para
          # trás numa alteração anterior e o build morria aqui: o composer.lock
          # exige >=8.4.1 e o vendor nem chegava a ser instalado.
          php-version: '8.4'
          coverage: none

      - name: Construir para produção
        working-directory: carta-api
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Montar o artefacto
        env:
          DEPLOY_FINALIZE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A árvore espelha o public_html do servidor:
        #
        #   /            → conteúdo de carta-api/public (o que a web serve)
        #   /carta-api/  → aplicação + vendor, atrás de um .htaccess que nega
        #                  tudo — é a única coisa entre o .env e a internet.
        #
        # O .env fica de fora e ignorado: entra no servidor uma vez, pelo File
        # Manager, e nenhum pull lhe toca.
        run: |
          mkdir -p artefacto/carta-api

          rsync -a carta-api/public/ artefacto/

          rsync -a \
            --exclude='/public' \
            --exclude='/.gitignore' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='/tests' \
            --exclude='node_modules' \
            --exclude='/composer.json' \
            --exclude='/composer.lock' \
            --exclude='/package.json' \
            --exclude='/vite.config.js' \
            --exclude='/.npmrc' \
            --exclude='/phpunit.xml' \
            --exclude='/.phpunit.result.cache' \
            --exclude='/README.md' \
            --exclude='/*.md' \
            carta-api/ artefacto/carta-api/

          # storage/logs não vem no checkout (o repo só guarda o esqueleto).
          mkdir -p artefacto/carta-api/storage/logs
          printf '*\n!.gitignore\n' > artefacto/carta-api/storage/logs/.gitignore

          # O index.php procurava a app um nível acima; agora ela é a pasta
          # irmã dentro da mesma raiz.
          sed -i "s|__DIR__\.'/\.\./|__DIR__.'/carta-api/|g" artefacto/index.php
          grep -n "carta-api" artefacto/index.php

          cat > artefacto/carta-api/.htaccess <<'HTACCESS'
          # Esta pasta guarda a aplicação: o .env com a chave que cobra
          # clientes, o código e as dependências. Nada aqui pode ser servido.
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
          </IfModule>
          <IfModule mod_php.c>
              php_flag engine off
          </IfModule>
          HTACCESS

          cat > artefacto/.gitignore <<'PERSISTENT'
          carta-api/.env
          images/questions/*
          !images/questions/.gitkeep
          images/signs/*
          !images/signs/.gitkeep
          PERSISTENT

          # A versão é pública e permite confirmar que o Hostinger instalou
          # exatamente este build, sem executar PHP ou consultar a base.
          printf '%s\n' "$GITHUB_SHA" > artefacto/deploy-version.txt

          # Só o hash entra no artefacto. O token continua guardado nos Secrets
          # do GitHub e autentica a migração/cache após a cópia dos ficheiros.
          test -n "$DEPLOY_FINALIZE_TOKEN"
          printf '%s' "$DEPLOY_FINALIZE_TOKEN" \
            | sha256sum | cut -d' ' -f1 > artefacto/carta-api/.deploy-token.sha256

      - name: Validar o artefacto
        # Falha antes de publicar se alguma pasta do monorepo ou ficheiro
        # sensível entrar por engano. O servidor recebe só o public da API e a
        # aplicação carta-api já com as dependências de produção.
        run: |
          test -f artefacto/index.php
          test -f artefacto/carta-api/artisan
          test -f artefacto/carta-api/vendor/autoload.php
          test -s artefacto/deploy-version.txt
          test -s artefacto/carta-api/.deploy-token.sha256
          test ! -e artefacto/carta-app
          test ! -e artefacto/carta-api/tests
          test ! -e artefacto/carta-api/node_modules
          test ! -e artefacto/carta-api/.env
          test ! -e artefacto/carta-api/composer.json
          test ! -e artefacto/carta-api/composer.lock

          if find artefacto -type f -name '.env*' -print -quit | grep -q .; then
            echo 'Erro: o artefacto contém um ficheiro de ambiente.' >&2
            exit 1
          fi

          echo "Tamanho do artefacto: $(du -sh artefacto | cut -f1)"

      - name: Publicar no branch deploy
        id: publicar-deploy
        # Histórico descartável de propósito: o branch é um artefacto, não
        # código-fonte, e guardar builds antigos só incharia o repositório.
        working-directory: artefacto
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Imagens distribuídas com o código entram no build; novos uploads
          # feitos no servidor continuam ignorados e sobrevivem ao git pull.
          git add -f images/questions images/signs
          git commit -q -m "deploy: build de ${GITHUB_SHA::7}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

      - name: Acionar o deploy no Hostinger
        env:
          HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
          DEPLOY_SHA: ${{ steps.publicar-deploy.outputs.sha }}
        run: |
          test -n "$HOSTINGER_DEPLOY_WEBHOOK"

          payload=$(jq -cn \
            --arg ref 'refs/heads/deploy' \
            --arg before '0000000000000000000000000000000000000000' \
            --arg after "$DEPLOY_SHA" \
            --arg clone_url "https://github.com/${GITHUB_REPOSITORY}.git" \
            --arg full_name "$GITHUB_REPOSITORY" \
            '{
              ref: $ref,
              before: $before,
              after: $after,
              repository: {clone_url: $clone_url, full_name: $full_name},
              pusher: {name: "github-actions[bot]"}
            }')

          curl --fail --silent --show-error --retry 3 \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "payload=$payload" \
            "$HOSTINGER_DEPLOY_WEBHOOK"

      - name: Aguardar a versão no servidor
        run: |
          for tentativa in $(seq 1 30); do
            versao=$(curl --silent --show-error --max-time 15 \
              "$APP_URL/deploy-version.txt?t=$GITHUB_RUN_ID-$tentativa" || true)

            if [ "$versao" = "$GITHUB_SHA" ]; then
              echo "Build $GITHUB_SHA instalado no Hostinger."
              exit 0
            fi

            echo "Tentativa $tentativa/30: Hostinger ainda devolve ${versao:-sem versão}."
            sleep 10
          done

          echo 'O Hostinger não instalou o build esperado dentro de 5 minutos.' >&2
          exit 1

      - name: Finalizar banco de dados e caches
        env:
          DEPLOY_FINALIZE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 2 \
            --request POST \
            --header "Authorization: Bearer $DEPLOY_FINALIZE_TOKEN" \
            --header 'Accept: application/json' \
            --header "X-Deploy-Version: $GITHUB_SHA" \
            "$APP_URL/deploy-finalize.php"

      - name: Confirmar que a API responde
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$APP_URL/up")
          echo "GET /up devolveu $codigo (esperado: 200)"
          test "$codigo" = '200'
