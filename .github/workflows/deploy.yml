# Publica a API quando main muda — via branch `deploy` + Git deploy do Hostinger.
#
# O Hostinger sabe fazer `git pull`, mas não corre composer nem build nenhum.
# Então o build corre aqui, nas máquinas do GitHub, e o resultado é empurrado
# para o branch `deploy`: uma árvore pronta a servir, com vendor/ incluído.
# O webhook do Hostinger (configurado no GitHub) faz o pull a seguir.
#
# Este modelo não precisa de segredos nenhuns: o GITHUB_TOKEN do próprio
# workflow autoriza o push para o mesmo repositório. O FTP foi abandonado
# porque nunca chegou a ter credenciais e o SSH não está disponível no plano.
#
# O deploy depende dos testes. As rotas de cobrança ficam desligadas por
# PAYMENTS_ENABLED=false até a integração estar pronta para produção.

name: Deploy API

on:
  push:
    branches: [main]
    # Alterações da app móvel não publicam nem consomem minutos de CI da API.
    paths:
      - 'carta-api/**'
      - '.github/workflows/deploy.yml'
  # Permite publicar à mão a partir do separador Actions, sem um commit novo.
  workflow_dispatch:

concurrency:
  # Dois builds em simultâneo terminariam em dois force-push desordenados.
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testes:
    # No acionamento manual o GitHub permite escolher uma branch. Apenas main
    # pode ser transformada no artefacto de produção.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carta-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # A mesma do servidor. O site correu em 8.3 até o composer.lock
          # passar a exigir >=8.4.1 — o vendor construído em 8.4 recusava
          # arrancar lá e todo o site respondia 500 sem dizer porquê. A versão
          # daqui, a do servidor e a do lock têm de andar juntas.
          php-version: '8.4'
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      # Sem preparar ambiente: o .env.testing está no repositório e o Laravel
      # prefere-o quando APP_ENV=testing, que é o que o phpunit.xml define.
      - name: Testes
        run: php artisan test

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Tem de acompanhar a do job de testes e a do servidor. Ficou para
          # trás numa alteração anterior e o build morria aqui: o composer.lock
          # exige >=8.4.1 e o vendor nem chegava a ser instalado.
          php-version: '8.4'
          coverage: none

      - name: Construir para produção
        working-directory: carta-api
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Montar o artefacto
        # A árvore espelha o public_html do servidor:
        #
        #   /            → conteúdo de carta-api/public (o que a web serve)
        #   /carta-api/  → aplicação + vendor, atrás de um .htaccess que nega
        #                  tudo — é a única coisa entre o .env e a internet.
        #
        # O .env fica de fora e ignorado: entra no servidor uma vez, pelo File
        # Manager, e nenhum pull lhe toca.
        run: |
          mkdir -p artefacto/carta-api

          rsync -a carta-api/public/ artefacto/

          rsync -a \
            --exclude='/public' \
            --exclude='/.gitignore' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='/tests' \
            --exclude='node_modules' \
            carta-api/ artefacto/carta-api/

          # storage/logs não vem no checkout (o repo só guarda o esqueleto).
          mkdir -p artefacto/carta-api/storage/logs
          printf '*\n!.gitignore\n' > artefacto/carta-api/storage/logs/.gitignore

          # O index.php procurava a app um nível acima; agora ela é a pasta
          # irmã dentro da mesma raiz.
          sed -i "s|__DIR__\.'/\.\./|__DIR__.'/carta-api/|g" artefacto/index.php
          grep -n "carta-api" artefacto/index.php

          cat > artefacto/carta-api/.htaccess <<'HTACCESS'
          # Esta pasta guarda a aplicação: o .env com a chave que cobra
          # clientes, o código e as dependências. Nada aqui pode ser servido.
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
          </IfModule>
          <IfModule mod_php.c>
              php_flag engine off
          </IfModule>
          HTACCESS

          printf 'carta-api/.env\n' > artefacto/.gitignore

      - name: Validar o artefacto
        # Falha antes de publicar se alguma pasta do monorepo ou ficheiro
        # sensível entrar por engano. O servidor recebe só o public da API e a
        # aplicação carta-api já com as dependências de produção.
        run: |
          test -f artefacto/index.php
          test -f artefacto/carta-api/artisan
          test -f artefacto/carta-api/vendor/autoload.php
          test ! -e artefacto/carta-app
          test ! -e artefacto/carta-api/tests
          test ! -e artefacto/carta-api/node_modules
          test ! -e artefacto/carta-api/.env

          if find artefacto -type f -name '.env*' -print -quit | grep -q .; then
            echo 'Erro: o artefacto contém um ficheiro de ambiente.' >&2
            exit 1
          fi

          echo "Tamanho do artefacto: $(du -sh artefacto | cut -f1)"

      - name: Publicar no branch deploy
        # Histórico descartável de propósito: o branch é um artefacto, não
        # código-fonte, e guardar builds antigos só incharia o repositório.
        working-directory: artefacto
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: build de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

      - name: Confirmar que a API responde
        # Informativo, não bloqueante: o pull do Hostinger chega via webhook e
        # o tempo dele não é nosso — falhar aqui num dia lento seria alarme
        # falso sobre um deploy que está bem.
        continue-on-error: true
        run: |
          sleep 45
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://ivory-shark-126778.hostingersite.com/up)
          echo "GET /up devolveu $codigo (esperado: 200)"
